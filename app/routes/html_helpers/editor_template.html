<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <script type="text/javascript" src="/web-apps/apps/api/documents/api.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        #editor-container {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="editor-container"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            new DocsAPI.DocEditor("editor-container", {
                document: {
                    fileType: "docx",
                    key: {{ key | tojson }},
                    title: {{ title | tojson }},
                    url: {{ ("http://nginx" ~ url) | tojson }},
                    permissions: {
                        download: true,
                        edit: true,
                        print: true
                    }
                },
                documentType: "word",
                editorConfig: {
                    mode: "edit",
                    lang: "ru",
                    user: {
                        id: "1",
                        name: "Guest"
                    }
                }
            });
        });
    </script>
</body>
</html>
