events {
    worker_connections 1024;
}
http {
    resolver 127.0.0.11 valid=30s;
    upstream onlyoffice {
        server onlyoffice:80;
    }
    upstream flaskapp {
        server webserver:5000;
    }
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    map $http_host $this_host {
        "" $host;
        default $http_host;
    }
    map $http_x_forwarded_proto $the_scheme {
         default $http_x_forwarded_proto;
         "" $scheme;
    }
    map $http_x_forwarded_host $the_host {
        default $http_x_forwarded_host;
        "" $this_host;
    }
    map $http_upgrade $proxy_connection {
        default upgrade;
        "" close;
    }

    server {
        listen 80;
        server_name localhost;
        server_tokens off;

        # No CORS headers anywhere, deliberately: this deployment is single-origin.
        # Every URL the app hands the browser is relative (/init, /documents/…,
        # /web-apps/…), so same-origin policy never asks; and Document Server fetches
        # the DOCX itself, server-side (document.url is prefixed http://nginx in
        # editor_template.html), where no browser policy applies. A wildcard would
        # only grant other sites scripted reads of this service and of user documents.

        # Behind a docker port map (host 5555 -> container 80), nginx's default
        # absolutizes a redirect to its own listen port (80), dropping :5555. Keep
        # nginx-issued redirects relative so the browser resolves them against the
        # origin it used. (Only governs redirects nginx issues itself — the bare root,
        # /documents/ dir redirects — not proxied upstream ones, which are already
        # relative and pass through.)
        absolute_redirect off;

        # Bare root → app entry point. Exact match (only "/", not /coauthoring/,
        # /cache/, … — those still fall through to the catch-all → OnlyOffice).
        location = / {
            return 302 /init;
        }

        # Flask app routes — one block for all of them (shared proxy target + headers).
        # Max settings apply to all: 100M body (uploads on /init,/debug/; zip on
        # /download) and 300s timeouts (render on /generate; zip on /download) — the
        # permissive caps are harmless on the routes that don't need them. No end-anchor
        # → prefix-match semantics preserved (/debug/inflections, /inflection/lookup hit).
        location ~ ^/(init|select|reset|debug-vars|debug/|inflection/|generate|download) {
            proxy_pass http://flaskapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100M;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
            send_timeout 300;
        }

        # Document storage path. Same-origin with the app — nginx serves both the
        # pages and these files — so no CORS headers belong here. The bytes are
        # fetched by Document Server itself (Node.js, server-side: see
        # editor_template.html, which prefixes document.url with http://nginx, a
        # container-network name no browser can even resolve), never by page script.
        # A wildcard here would only widen scripted reads of user documents to every
        # origin — and `*` beside Allow-Credentials is rejected by browsers anyway.
        location ^~ /documents/ {
            alias /usr/share/nginx/documents/;
            try_files $uri $uri/ =404;
        }

        # WebSocket connections
        location ~* /(doc/|socket\.io) {
            proxy_pass http://onlyoffice;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $proxy_connection;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $the_host;
            proxy_set_header X-Forwarded-Proto $the_scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # API requests
        location ~* ^/(web-apps|sdkjs|license.txt) {
            proxy_pass http://onlyoffice;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $the_host;
            proxy_set_header X-Forwarded-Proto $the_scheme;
        }

        # Ignore missing source map files
        location ~* \.map$ {
            return 204;
        }

        # Proxy all other requests to OnlyOffice
        location / {
            proxy_pass http://onlyoffice;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $the_host;
            proxy_set_header X-Forwarded-Proto $the_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $proxy_connection;
        }
    }
}
